{% extends "base.html" %}

{% block title %}Registrar Línea{% endblock %}

{% block content %}
<h2><i class="fas fa-plus"></i> Registrar Nueva Línea</h2>
<button class="btn back-btn" onclick="window.location.href='/lineas'"><i class="fas fa-arrow-left"></i> Volver a Líneas</button>

<div id="error-message" style="display: none; background: #f44336; color: white; padding: 10px; border-radius: 5px; margin-bottom: 15px;"></div>
<div id="success-message" style="display: none; background: #4caf50; color: white; padding: 10px; border-radius: 5px; margin-bottom: 15px;"></div>

<form id="lineaForm" enctype="multipart/form-data">
    <input type="text" id="nombre" placeholder="Nombre de la línea" required>
    
    <textarea id="descripcion" placeholder="Descripción de la línea" rows="4" required></textarea>
    
    <div class="file-upload-section">
        <label for="imagen_logo">Logo de la empresa (250x250px recomendado):</label>
        <input type="file" id="imagen_logo" name="imagen_logo" accept="image/*" onchange="previewImage(this)">
        <div class="image-preview" id="imagePreview">
            <div class="preview-placeholder">
                <i class="fas fa-image"></i>
                <p>Vista previa de la imagen</p>
            </div>
        </div>
    </div>
    
    <button type="submit" id="submitBtn"><i class="fas fa-save"></i> Guardar Línea</button>
</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
    checkAuth();
    
    const lineaForm = document.getElementById('lineaForm');
    lineaForm.addEventListener('submit', handleSubmit);
});

async function checkAuth() {
    try {
        const response = await fetch('/api/auth/status');
        const data = await response.json();
        
        if (!data.authenticated) {
            window.location.href = '/login';
            return;
        }
    } catch (error) {
        console.error('Error verificando autenticación:', error);
        window.location.href = '/login';
    }
}

function previewImage(input) {
    const preview = document.getElementById('imagePreview');
    
    if (input.files && input.files[0]) {
        const validTypes = ['image/jpeg', 'image/png', 'image/gif'];
        if (!validTypes.includes(input.files[0].type)) {
            alert('Solo se permiten imágenes JPG, PNG o GIF');
            input.value = '';
            return;
        }
        
        const reader = new FileReader();
        
        reader.onload = function(e) {
            preview.innerHTML = `
                <img src="${e.target.result}" alt="Vista previa" class="preview-image">
                <p>Vista previa - Se redimensionará a 250x250px</p>
            `;
        }
        
        reader.readAsDataURL(input.files[0]);
    } else {
        preview.innerHTML = `
            <div class="preview-placeholder">
                <i class="fas fa-image"></i>
                <p>Vista previa de la imagen</p>
            </div>
        `;
    }
}

async function handleSubmit(e) {
    e.preventDefault();
    
    const errorDiv = document.getElementById('error-message');
    const successDiv = document.getElementById('success-message');
    const submitBtn = document.getElementById('submitBtn');
    
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';
    
    const nombre = document.getElementById('nombre').value;
    const nombreNormalizado = nombre.trim().toLowerCase();
    
    try {
        const response = await fetch(`/api/lineas/check-name?nombre=${encodeURIComponent(nombreNormalizado)}`);
        const data = await response.json();
        
        if (data.exists) {
            errorDiv.textContent = 'Ya existe una línea con este nombre';
            errorDiv.style.display = 'block';
            return;
        }
    } catch (error) {
        console.error('Error verificando nombre:', error);
        errorDiv.textContent = 'Error al verificar nombre. Intente nuevamente.';
        errorDiv.style.display = 'block';
        return;
    }
    
    const formData = new FormData();
    formData.append('nombre', nombre);
    formData.append('descripcion', document.getElementById('descripcion').value);
    
    const imagenFile = document.getElementById('imagen_logo').files[0];
    if (imagenFile) {
        formData.append('imagen_logo', imagenFile);
    }
    
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';
    submitBtn.disabled = true;
    
    try {
        const response = await fetch('/api/lineas', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        if (response.ok) {
            successDiv.textContent = data.message;
            successDiv.style.display = 'block';
            
            document.getElementById('lineaForm').reset();
            previewImage(document.getElementById('imagen_logo'));
            
            setTimeout(() => {
                window.location.href = '/lineas';
            }, 2000);
        } else {
            errorDiv.textContent = data.error || 'Error al registrar línea';
            errorDiv.style.display = 'block';
        }
    } catch (error) {
        console.error('Error registrando línea:', error);
        errorDiv.textContent = 'Error de conexión. Intente nuevamente.';
        errorDiv.style.display = 'block';
    } finally {
        submitBtn.innerHTML = '<i class="fas fa-save"></i> Guardar Línea';
        submitBtn.disabled = false;
    }
}
</script>
{% endblock %}
