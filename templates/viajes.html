{% extends "base.html" %}

{% block title %}Viajes{% endblock %}

{% block content %}
<h2><i class="fas fa-bus"></i> Gestión de Viajes</h2>
<button class="btn" onclick="window.location.href='/registrar-viaje'"><i class="fas fa-plus"></i> Nuevo Viaje</button>

<div id="loading" style="text-align: center; padding: 20px;">
    <i class="fas fa-spinner fa-spin"></i> Cargando viajes...
</div>

<div id="viajes-container" style="display: none;">
    <table id="viajes-table">
        <tr>
            <th>#</th>
            <th>Ruta</th>
            <th>Conductor</th>
            <th>Fechas</th>
            <th>Acciones</th>
        </tr>
    </table>
</div>

<div id="no-viajes" style="display: none;">
    <div class="info-card">
        <div style="text-align: center; padding: 40px;">
            <i class="fas fa-bus" style="font-size: 4rem; color: #bdc3c7; margin-bottom: 20px;"></i>
            <h3 style="color: #7f8c8d;">No hay viajes registrados</h3>
            <p style="color: #95a5a6;">Comience programando un nuevo viaje.</p>
        </div>
    </div>
</div>

<div id="error-container" style="display: none;">
    <div class="flash-message" style="background: #f44336;">
        Error al cargar los viajes. 
        <button onclick="loadViajes()" style="background: none; border: 1px solid white; color: white; padding: 5px 10px; margin-left: 10px;">Reintentar</button>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    checkAuth();
    loadViajes();
});

async function checkAuth() {
    try {
        const response = await fetch('/api/auth/status');
        const data = await response.json();
        
        if (!data.authenticated) {
            window.location.href = '/login';
            return;
        }
    } catch (error) {
        console.error('Error verificando autenticación:', error);
        window.location.href = '/login';
    }
}

async function loadViajes() {
    const loadingDiv = document.getElementById('loading');
    const containerDiv = document.getElementById('viajes-container');
    const noViajesDiv = document.getElementById('no-viajes');
    const errorContainer = document.getElementById('error-container');
    
    loadingDiv.style.display = 'block';
    containerDiv.style.display = 'none';
    noViajesDiv.style.display = 'none';
    errorContainer.style.display = 'none';

    try {
        const response = await fetch('/api/viajes');
        
        if (!response.ok) {
            throw new Error('Error al obtener viajes');
        }
        
        const data = await response.json();
        const viajes = data.viajes || [];
        
        loadingDiv.style.display = 'none';
        
        if (viajes.length === 0) {
            noViajesDiv.style.display = 'block';
        } else {
            renderViajes(viajes);
            containerDiv.style.display = 'block';
        }
        
    } catch (error) {
        console.error('Error cargando viajes:', error);
        loadingDiv.style.display = 'none';
        errorContainer.style.display = 'block';
    }
}

function renderViajes(viajes) {
    const table = document.getElementById('viajes-table');
    
    while(table.rows.length > 1) {
        table.deleteRow(1);
    }
    
    viajes.forEach((viaje, index) => {
        const row = table.insertRow();
        
        const fechaSalida = new Date(viaje.fecha_salida);
        const fechaLlegada = new Date(viaje.fecha_llegada);
        
        const options = { 
            year: 'numeric', 
            month: 'short', 
            day: 'numeric',
            hour: '2-digit', 
            minute: '2-digit'
        };
        
        row.innerHTML = `
            <td>${index + 1}</td>
            <td>${viaje.rutas_asignadas}</td>
            <td>${viaje.apellido}, ${viaje.nombre}</td>
            <td>
                <strong>Salida:</strong> ${fechaSalida.toLocaleString('es-ES', options)}<br>
                <strong>Llegada:</strong> ${fechaLlegada.toLocaleString('es-ES', options)}
            </td>
            <td>
                <button class="btn-small details" onclick="verViaje(${viaje.id})">
                    <i class="fas fa-search"></i>
                </button>
                <button class="btn-small delete" onclick="eliminarViaje(${viaje.id})">
                    <i class="fas fa-trash"></i>
                </button>
                <button class="btn-small map-btn" onclick="abrirMapaParaViaje(${viaje.id})">
                    <i class="fas fa-map"></i> Ruta
                </button>
            </td>
        `;
    });
}

function verViaje(id) {
    window.location.href = `/ver-viaje/${id}`;
}

function abrirMapaParaViaje(viajeId) {
    window.location.href = `/ver-mapa-ruta/${viajeId}`;
}

async function eliminarViaje(id) {
    if (!confirm('¿Está seguro de que desea eliminar este viaje?')) {
        return;
    }
    
    try {
        const response = await fetch(`/api/viajes/${id}`, {
            method: 'DELETE'
        });
        
        const data = await response.json();
        
        if (response.ok) {
            alert('Viaje eliminado correctamente');
            loadViajes(); 
        } else {
            alert(data.error || 'Error al eliminar viaje');
        }
    } catch (error) {
        console.error('Error eliminando viaje:', error);
        alert('Error de conexión al eliminar viaje');
    }
}
</script>
{% endblock %}
