{% extends "base.html" %}

{% block title %}Opciones{% endblock %}

{% block content %}
<h2><i class="fas fa-cog"></i> Configuración de Cuenta</h2>

<div id="loading" style="text-align: center; padding: 20px; display: none;">
    <i class="fas fa-spinner fa-spin"></i> Procesando...
</div>

<div id="error-message" style="display: none; background: #f44336; color: white; padding: 10px; border-radius: 5px; margin-bottom: 15px;"></div>
<div id="success-message" style="display: none; background: #4caf50; color: white; padding: 10px; border-radius: 5px; margin-bottom: 15px;"></div>

<div class="options-section">
    <h3>Cambiar Credenciales</h3>
    <form id="credencialesForm">
        <input type="password" id="contrasena_actual" placeholder="Contraseña Actual" required>
        <input type="text" id="nuevo_usuario" placeholder="Nuevo Usuario" required>
        <input type="password" id="nueva_contrasena" placeholder="Nueva Contraseña" required>
        <button type="submit" id="cambiarBtn">Actualizar Credenciales</button>
    </form>
</div>

<div class="options-section danger-section">
    <h3><i class="fas fa-exclamation-triangle"></i> Eliminar Información</h3>
    <p><strong>¡ATENCIÓN!</strong> Esta acción eliminará permanentemente todos los conductores, vehículos y viajes registrados.</p>
    
    <button type="button" class="btn-danger" id="eliminarBtn">
        <i class="fas fa-trash"></i> Eliminar Toda la Información
    </button>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    checkAuth();
    
    const credencialesForm = document.getElementById('credencialesForm');
    const eliminarBtn = document.getElementById('eliminarBtn');
    
    credencialesForm.addEventListener('submit', handleCambiarCredenciales);
    eliminarBtn.addEventListener('click', handleEliminarDatos);
});

async function checkAuth() {
    try {
        const response = await fetch('/api/auth/status', {
            credentials: 'include'
        });
        const data = await response.json();
        
        if (!data.authenticated) {
            window.location.href = '/';
            return;
        }
    } catch (error) {
        console.error('Error verificando autenticación:', error);
        window.location.href = '/';
    }
}

function showMessage(message, isError = false) {
    const errorDiv = document.getElementById('error-message');
    const successDiv = document.getElementById('success-message');
    
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';
    
    if (isError) {
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
    } else {
        successDiv.textContent = message;
        successDiv.style.display = 'block';
    }
    
    setTimeout(() => {
        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';
    }, 5000);
}

function showLoading(show) {
    document.getElementById('loading').style.display = show ? 'block' : 'none';
}

async function handleCambiarCredenciales(e) {
    e.preventDefault();
    
    const cambiarBtn = document.getElementById('cambiarBtn');
    const formData = {
        contrasena_actual: document.getElementById('contrasena_actual').value,
        nuevo_usuario: document.getElementById('nuevo_usuario').value,
        nueva_contrasena: document.getElementById('nueva_contrasena').value
    };
    
    cambiarBtn.textContent = 'Actualizando...';
    cambiarBtn.disabled = true;
    showLoading(true);
    
    try {
        const response = await fetch('/api/opciones/cambiar-credenciales', {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
            },
            credentials: 'include',
            body: JSON.stringify(formData)
        });
        
        const data = await response.json();
        
        if (response.ok) {
            showMessage(data.message);
            document.getElementById('credencialesForm').reset();
            
            if (data.logout_required) {
                showMessage('Credenciales actualizadas. Redirigiendo al login...');
                setTimeout(() => {
                    logout();
                }, 2000);
            }
        } else {
            showMessage(data.error || 'Error al actualizar credenciales', true);
        }
    } catch (error) {
        console.error('Error cambiando credenciales:', error);
        showMessage('Error de conexión. Intente nuevamente.', true);
    } finally {
        cambiarBtn.textContent = 'Actualizar Credenciales';
        cambiarBtn.disabled = false;
        showLoading(false);
    }
}

async function handleEliminarDatos() {
    if (!confirm('¿Está seguro de que desea eliminar toda la información?\n\nEsta acción NO se puede deshacer.')) {
        return;
    }
    
    if (!confirm('¿REALMENTE está seguro? Esta acción eliminará TODOS los datos permanentemente.')) {
        return;
    }
    
    const password = prompt("Por favor ingrese su contraseña para confirmar:");
    if (!password) return;
    
    const eliminarBtn = document.getElementById('eliminarBtn');
    eliminarBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Eliminando...';
    eliminarBtn.disabled = true;
    showLoading(true);
    
    try {
        const response = await fetch('/api/opciones/eliminar-datos', {
            method: 'DELETE',
            credentials: 'include',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ password: password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            showMessage(data.message);
        } else {
            showMessage(data.error || 'Error al eliminar datos', true);
        }
    } catch (error) {
        console.error('Error eliminando datos:', error);
        showMessage('Error de conexión. Intente nuevamente.', true);
    } finally {
        eliminarBtn.innerHTML = '<i class="fas fa-trash"></i> Eliminar Toda la Información';
        eliminarBtn.disabled = false;
        showLoading(false);
    }
}

async function logout() {
    try {
        await fetch('/api/auth/logout', { 
            method: 'POST', 
            credentials: 'include' 
        });
        window.location.href = '/';
    } catch (error) {
        console.error('Error cerrando sesión:', error);
        window.location.href = '/';
    }
}
</script>
{% endblock %}
