{% extends "base.html" %}

{% block title %}Inicio de Sesión{% endblock %}

{% block auth_content %}
<h2>Inicio de Sesión</h2>
<div id="error-message" style="display: none; background: #f44336; color: white; padding: 10px; border-radius: 5px; margin-bottom: 15px;"></div>
<div id="setup-message" style="display: none; background: #ff9800; color: white; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
    No hay usuarios registrados. Creando usuario inicial...
</div>

<form id="loginForm">
    <input type="text" id="nombre" name="nombre" placeholder="Usuario" required>
    <input type="password" id="contrasena" name="contrasena" placeholder="Contraseña" required>
    <button type="submit" id="loginBtn">Ingresar</button>
</form>

<div id="initialSetup" style="display: none;">
    <h3>Configuración Inicial</h3>
    <p>Crea el primer usuario administrador:</p>
    <form id="setupForm">
        <input type="text" id="setupNombre" placeholder="Nombre de usuario" required>
        <input type="password" id="setupContrasena" placeholder="Contraseña" required>
        <button type="submit">Crear Usuario</button>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const loginForm = document.getElementById('loginForm');
    const setupForm = document.getElementById('setupForm');
    const errorDiv = document.getElementById('error-message');
    const setupDiv = document.getElementById('setup-message');
    const initialSetupDiv = document.getElementById('initialSetup');
    const loginBtn = document.getElementById('loginBtn');

    checkAuthStatus();

    async function checkAuthStatus() {
        try {
            const response = await fetch('/api/auth/status');
            const data = await response.json();
            if (data.authenticated) {
                window.location.href = '/dashboard';
            }
        } catch (error) {
            console.log('No autenticado');
        }
    }

    function showError(message) {
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        setTimeout(() => {
            errorDiv.style.display = 'none';
        }, 5000);
    }

    function showSetupMessage() {
        setupDiv.style.display = 'block';
        setTimeout(() => {
            setupDiv.style.display = 'none';
        }, 3000);
    }

    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const nombre = document.getElementById('nombre').value;
        const contrasena = document.getElementById('contrasena').value;
        
        loginBtn.textContent = 'Ingresando...';
        loginBtn.disabled = true;

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    nombre: nombre,
                    contrasena: contrasena
                })
            });

            const data = await response.json();

            if (response.ok) {
                if (data.authenticated) {
                    window.location.href = '/dashboard';
                }
            } else {
                if (data.needs_initial_setup) {
                    showSetupMessage();
                    loginForm.style.display = 'none';
                    initialSetupDiv.style.display = 'block';
                } else {
                    showError(data.error || 'Error al iniciar sesión');
                }
            }
        } catch (error) {
            showError('Error de conexión. Intenta nuevamente.');
        } finally {
            loginBtn.textContent = 'Ingresar';
            loginBtn.disabled = false;
        }
    });

    setupForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const nombre = document.getElementById('setupNombre').value;
        const contrasena = document.getElementById('setupContrasena').value;

        try {
            const response = await fetch('/api/auth/register-initial', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    nombre: nombre,
                    contrasena: contrasena
                })
            });

            const data = await response.json();

            if (response.ok) {
                alert('Usuario creado correctamente. Ahora puedes iniciar sesión.');
                initialSetupDiv.style.display = 'none';
                loginForm.style.display = 'block';
                document.getElementById('nombre').value = nombre;
            } else {
                showError(data.error || 'Error al crear usuario');
            }
        } catch (error) {
            showError('Error de conexión. Intenta nuevamente.');
        }
    });
});
</script>
{% endblock %}
