{% extends "base.html" %}

{% block title %}Información de la Línea{% endblock %}

{% block content %}
<h2><i class="fas fa-layer-group"></i> Información de la Línea</h2>
<button class="btn back-btn" onclick="window.location.href='/lineas'"><i class="fas fa-arrow-left"></i> Volver a Líneas</button>

<div id="loading" style="text-align: center; padding: 20px;">
    <i class="fas fa-spinner fa-spin"></i> Cargando información de la línea...
</div>

<div id="linea-container" style="display: none;">
    <div class="info-card">
        <h3 id="nombreLinea"></h3>
        
        <div class="linea-info-container">
            <div class="linea-logo" id="logoContainer">
            </div>
            
            <div class="linea-details">
                <div class="info-row">
                    <strong>Nombre:</strong> <span id="nombre"></span>
                </div>
                <div class="info-row">
                    <strong>Estado:</strong> <span id="estado"></span>
                </div>
                <div class="info-row">
                    <strong>Descripción:</strong>
                </div>
                <div class="descripcion-completa" id="descripcion">
                </div>
                <div class="info-row">
                    <strong>Fecha de Creación:</strong> <span id="fechaCreacion"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="error-container" style="display: none;">
    <div class="flash-message" style="background: #f44336;">
        Error al cargar la información de la línea. 
        <button onclick="loadLinea()" style="background: none; border: 1px solid white; color: white; padding: 5px 10px; margin-left: 10px;">Reintentar</button>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    checkAuth();
    loadLinea();
});

async function checkAuth() {
    try {
        const response = await fetch('/api/auth/status');
        const data = await response.json();
        
        if (!data.authenticated) {
            window.location.href = '/login';
            return;
        }
    } catch (error) {
        console.error('Error verificando autenticación:', error);
        window.location.href = '/login';
    }
}

async function loadLinea() {
    const loadingDiv = document.getElementById('loading');
    const containerDiv = document.getElementById('linea-container');
    const errorContainer = document.getElementById('error-container');
    
    const pathParts = window.location.pathname.split('/');
    const id = pathParts[pathParts.length - 1];
    
    if (!id || isNaN(id)) {
        errorContainer.style.display = 'block';
        loadingDiv.style.display = 'none';
        return;
    }
    
    loadingDiv.style.display = 'block';
    containerDiv.style.display = 'none';
    errorContainer.style.display = 'none';

    try {
        const response = await fetch(`/api/lineas/${id}`);
        
        if (!response.ok) {
            throw new Error('Error al obtener línea');
        }
        
        const data = await response.json();
        const linea = data.linea;
        
        document.getElementById('nombreLinea').textContent = linea.nombre;
        document.getElementById('nombre').textContent = linea.nombre;
        document.getElementById('descripcion').textContent = linea.descripcion || 'Sin descripción';
        
        document.getElementById('estado').textContent = linea.activa ? 'Activa' : 'Inactiva';
        document.getElementById('estado').style.color = linea.activa ? '#4caf50' : '#f44336';
        
        const fecha = new Date(linea.fecha_creacion);
        document.getElementById('fechaCreacion').textContent = fecha.toLocaleDateString('es-ES', { 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
        
        const logoContainer = document.getElementById('logoContainer');
        if (linea.imagen_logo) {
            logoContainer.innerHTML = `
                <img src="/static/uploads/logos/${linea.imagen_logo}" 
                     alt="Logo ${linea.nombre}" 
                     class="logo-display"
                     onerror="this.src='/static/default-logo.png'">
            `;
        } else {
            logoContainer.innerHTML = `
                <div class="logo-placeholder-large">
                    <i class="fas fa-image"></i>
                    <p>Sin logo</p>
                </div>
            `;
        }
        
        loadingDiv.style.display = 'none';
        containerDiv.style.display = 'block';
        
    } catch (error) {
        console.error('Error cargando línea:', error);
        loadingDiv.style.display = 'none';
        errorContainer.style.display = 'block';
    }
}
</script>
{% endblock %}
