<!DOCTYPE html>
<html>
<head>
    <title>OptiRutas - InterUrbana | {% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
</head>
<body>
    <div id="app-container">
        <div id="authenticated-content" class="hidden">
            <div class="container">
                <div class="sidebar">
                    <div class="user-info">
                        <h4><i class="fas fa-user"></i> <span id="username">Usuario</span></h4>
                    </div>
                    <a href="/dashboard"><i class="fas fa-home"></i> Inicio</a>
                    <a href="/lineas"><i class="fas fa-layer-group"></i> Líneas</a>
                    <a href="/conductores"><i class="fas fa-id-card"></i> Conductores</a>
                    <a href="/viajes"><i class="fas fa-bus"></i> Viajes</a>
                    <a href="/opciones"><i class="fas fa-cog"></i> Opciones</a>
                    <a href="#" onclick="logout()" class="logout"><i class="fas fa-lock"></i> Cerrar Sesión</a>
                </div>
                <div class="content">
                    <div id="flash-messages" class="flash-messages"></div>
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
        
        <div id="unauthenticated-content">
            {% block auth_content %}{% endblock %}
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            await checkGlobalAuth();
        });

        async function checkGlobalAuth() {
            try {
                const response = await fetch('/api/auth/status');
                const data = await response.json();
                
                if (data.authenticated) {
                    document.getElementById('username').textContent = data.usuario;
                    document.getElementById('authenticated-content').classList.remove('hidden');
                    document.getElementById('unauthenticated-content').classList.add('hidden');
                } else {
                    document.getElementById('authenticated-content').classList.add('hidden');
                    document.getElementById('unauthenticated-content').classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error verificando autenticación:', error);
                document.getElementById('authenticated-content').classList.add('hidden');
                document.getElementById('unauthenticated-content').classList.remove('hidden');
            }
        }

        async function logout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
                window.location.href = '/login';
            } catch (error) {
                console.error('Error cerrando sesión:', error);
                window.location.href = '/login';
            }
        }

        function confirmAction(msg, callback) {
            if(confirm(msg)) {
                if (typeof callback === 'function') {
                    callback();
                }
            }
        }
    </script>
</body>
</html>
