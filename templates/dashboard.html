{% extends "base.html" %}

{% block title %}Panel de Control{% endblock %}

{% block content %}
<h1><i class="fas fa-tachometer-alt"></i> Panel de Control</h1>

<div id="loading" style="text-align: center; padding: 20px;">
    <i class="fas fa-spinner fa-spin"></i> Cargando estadísticas...
</div>

<div class="stats" id="statsContainer" style="display: none;">
    <div class="stat-card">
        <h3>Conductores Registrados</h3>
        <p id="totalConductores">0</p>
    </div>
    <div class="stat-card">
        <h3>Viajes Programados</h3>
        <p id="totalViajes">0</p>
    </div>
    <div class="stat-card">
        <h3>Líneas Activas</h3>
        <p id="totalLineas">0</p>
    </div>
</div>

<div id="error-container" style="display: none;">
    <div class="flash-message" style="background: #f44336;">
        Error al cargar las estadísticas. <button onclick="loadDashboard()" style="background: none; border: 1px solid white; color: white; padding: 5px 10px; margin-left: 10px;">Reintentar</button>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    checkAuth();
    loadDashboard();
});

async function checkAuth() {
    try {
        const response = await fetch('/api/auth/status');
        const data = await response.json();
        
        if (!data.authenticated) {
            window.location.href = '/login';
            return;
        }
    } catch (error) {
        console.error('Error verificando autenticación:', error);
        window.location.href = '/login';
    }
}

async function loadDashboard() {
    const loadingDiv = document.getElementById('loading');
    const statsContainer = document.getElementById('statsContainer');
    const errorContainer = document.getElementById('error-container');
    
    loadingDiv.style.display = 'block';
    statsContainer.style.display = 'none';
    errorContainer.style.display = 'none';

    try {
        const response = await fetch('/api/dashboard');
        
        if (!response.ok) {
            throw new Error('Error al obtener datos');
        }
        
        const data = await response.json();
        
        document.getElementById('totalConductores').textContent = data.total_conductores || 0;
        document.getElementById('totalViajes').textContent = data.total_viajes || 0;
        document.getElementById('totalLineas').textContent = data.total_lineas || 0;
        
        loadingDiv.style.display = 'none';
        statsContainer.style.display = 'flex';
        
    } catch (error) {
        console.error('Error cargando dashboard:', error);
        loadingDiv.style.display = 'none';
        errorContainer.style.display = 'block';
    }
}

async function logout() {
    try {
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/login';
    } catch (error) {
        console.error('Error cerrando sesión:', error);
        window.location.href = '/login';
    }
}
</script>
{% endblock %}
