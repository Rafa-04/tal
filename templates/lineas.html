{% extends "base.html" %}

{% block title %}Líneas{% endblock %}

{% block content %}
<h2><i class="fas fa-layer-group"></i> Gestión de Líneas</h2>
<button class="btn" onclick="window.location.href='/registrar-linea'"><i class="fas fa-plus"></i> Nueva Línea</button>

<div id="loading" style="text-align: center; padding: 20px;">
    <i class="fas fa-spinner fa-spin"></i> Cargando líneas...
</div>

<div id="lineas-container" style="display: none;">
    <table id="lineas-table">
        <tr>
            <th>#</th>
            <th>Logo</th>
            <th>Nombre de Línea</th>
            <th>Descripción</th>
            <th>Acciones</th>
        </tr>
    </table>
</div>

<div id="no-lineas" style="display: none;">
    <div class="info-card">
        <div style="text-align: center; padding: 40px;">
            <i class="fas fa-layer-group" style="font-size: 4rem; color: #bdc3c7; margin-bottom: 20px;"></i>
            <h3 style="color: #7f8c8d;">No hay líneas registradas</h3>
            <p style="color: #95a5a6;">Comience registrando una nueva línea de transporte.</p>
        </div>
    </div>
</div>

<div id="error-container" style="display: none;">
    <div class="flash-message" style="background: #f44336;">
        Error al cargar las líneas. <button onclick="loadLineas()" style="background: none; border: 1px solid white; color: white; padding: 5px 10px; margin-left: 10px;">Reintentar</button>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    checkAuth();
    loadLineas();
});

async function checkAuth() {
    try {
        const response = await fetch('/api/auth/status');
        const data = await response.json();
        
        if (!data.authenticated) {
            window.location.href = '/';
            return;
        }
    } catch (error) {
        console.error('Error verificando autenticación:', error);
        window.location.href = '/';
    }
}

async function loadLineas() {
    const loadingDiv = document.getElementById('loading');
    const containerDiv = document.getElementById('lineas-container');
    const noLineasDiv = document.getElementById('no-lineas');
    const errorContainer = document.getElementById('error-container');
    
    loadingDiv.style.display = 'block';
    containerDiv.style.display = 'none';
    noLineasDiv.style.display = 'none';
    errorContainer.style.display = 'none';

    try {
        const response = await fetch('/api/lineas');
        
        if (!response.ok) {
            throw new Error('Error al obtener líneas');
        }
        
        const data = await response.json();
        const lineas = data.lineas || [];
        
        loadingDiv.style.display = 'none';
        
        if (lineas.length === 0) {
            noLineasDiv.style.display = 'block';
        } else {
            renderLineas(lineas);
            containerDiv.style.display = 'block';
        }
        
    } catch (error) {
        console.error('Error cargando líneas:', error);
        loadingDiv.style.display = 'none';
        errorContainer.style.display = 'block';
    }
}

function renderLineas(lineas) {
    const table = document.getElementById('lineas-table');
    
    while(table.rows.length > 1) {
        table.deleteRow(1);
    }
    
    lineas.forEach((linea, index) => {
        const row = table.insertRow();
        
        const logoHtml = linea.imagen_logo 
            ? `<img src="/static/uploads/logos/${linea.imagen_logo}" alt="Logo ${linea.nombre}" class="logo-thumbnail">`
            : `<div class="logo-placeholder"><i class="fas fa-image"></i></div>`;
        
        const descripcionCorta = linea.descripcion && linea.descripcion.length > 50 
            ? linea.descripcion.substring(0, 50) + '...'
            : linea.descripcion || '';
        
        row.innerHTML = `
            <td>${index + 1}</td>
            <td>${logoHtml}</td>
            <td>${linea.nombre}</td>
            <td>${descripcionCorta}</td>
            <td>
                <button class="btn-small details" onclick="verLinea(${linea.id})"><i class="fas fa-search"></i></button>
                <button class="btn-small delete" onclick="eliminarLinea(${linea.id})"><i class="fas fa-trash"></i></button>
            </td>
        `;
    });
}

async function verLinea(id) {
    window.location.href = `/ver-linea/${id}`;
}

async function eliminarLinea(id) {
    if (!confirm('¿Está seguro de que desea eliminar esta línea?')) {
        return;
    }
    
    try {
        const response = await fetch(`/api/lineas/${id}`, {
            method: 'DELETE'
        });
        
        const data = await response.json();
        
        if (response.ok) {
            alert('Línea eliminada correctamente');
            loadLineas();
        } else {
            alert(data.error || 'Error al eliminar línea');
        }
    } catch (error) {
        console.error('Error eliminando línea:', error);
        alert('Error de conexión al eliminar línea');
    }
}
</script>
{% endblock %}
